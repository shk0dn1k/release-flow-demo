# 1) Проверки ДО merge — гейт на pull request
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Формат заголовка PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            chore
            test
            docs

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh

  ai-review:
    name: AI-агенты (заглушка)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Здесь будут агенты: уязвимости, безопасность, тех-ревью."
          echo "В демо просто проходит."
