# 3) Release PR + деплой на прод после его merge
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Тег, созданный ботом, не запускает другие workflow (ограничение GITHUB_TOKEN),
  # поэтому деплой на прод — job в этом же workflow.
  deploy-prod:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: production   # здесь GitHub ждёт апрув
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Деплой на прод (симуляция)
        run: echo "Деплой ${{ needs.release-please.outputs.tag_name }} на прод (canary 10%)"
      - name: Health checks и smoke
        run: bash tests/smoke.sh
      - name: Полный трафик
        run: echo "100% трафика на ${{ needs.release-please.outputs.tag_name }}"
      - name: Автооткат при сбое
        if: failure()
        run: echo "Сбой! Откат на предыдущую версию"
