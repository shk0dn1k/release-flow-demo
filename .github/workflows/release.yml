# 3) Release PR: бот копит changelog и версию; после merge Release PR — тег и GitHub Release.
# Деплой на прод отдельно и вручную — см. deploy-prod.yml.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
